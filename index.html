<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Сапёр</title>
    <!-- Мобильное приложение (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f2933">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Сапёр">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/adaptive.css">
</head>

<body>
    <main class="game">
        <h1 class="game__title">Сапёр</h1>

        <!-- Панель игры: выбор сложности, счётчик мин, кнопка, таймер -->
        <div class="panel">
            <select id="difficulty">
                <option value="easy">Новичок 9×9</option>
                <option value="medium">Любитель 16×16</option>
                <option value="hard">Профи 16×30</option>
            </select>
            <span id="mines-counter">010</span>
            <button id="new-game" type="button">Новая игра</button>
            <span id="timer">000</span>
        </div>

        <!-- Игровое поле: клетки сюда добавляет board.js (Матвей) -->
        <div id="board"></div>
    </main>
    <!-- Окно результата: появляется после победы или проигрыша -->
    <div id="result" class="modal" hidden>
        <div class="modal__box">
            <h2 id="result-title" class="modal__title"></h2>
            <p id="result-text" class="modal__text"></p>
            <button id="result-again" class="modal__button" type="button">Играть
                ещё</button>
        </div>
    </div>

    <script src="js/game.js"></script>
    <script src="js/board.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/touch.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
